apply plugin: 'com.android.application'

apply plugin: 'com.google.gms.google-services'

// Release signing credentials, read only from keystore.properties (gitignored,
// see keystore.properties.example).
//
// Deliberately NOT System.getenv(): inside a build script that reads the Gradle
// daemon's environment, captured when the daemon started, not the environment of
// the shell running this build. A daemon left over from an earlier command signs
// with that command's stale credentials. Callers needing environment variables
// (CI) should write keystore.properties instead — build-release-bundle.sh does.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStorePath = keystoreProperties.getProperty('storeFile')
def canSignRelease = releaseStorePath != null && rootProject.file(releaseStorePath).exists()

android {
    namespace "com.antandbuffalo.birthdayreminder"
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.antandbuffalo.birthdayreminder"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 100
        versionName "3.16.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile rootProject.file(releaseStorePath)
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            // Without credentials the release build stays unsigned rather than
            // failing, so debug builds and CI checks still work on a clean clone.
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        // use this for testing
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude("META-INF/*.kotlin_module")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.preference:preference:1.1.0-rc01'
    implementation 'androidx.navigation:navigation-fragment:2.0.0'
    implementation 'androidx.navigation:navigation-ui:2.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    implementation 'com.google.api-client:google-api-client:1.23.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.23.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev110-1.23.0'

    implementation "com.google.android.gms:play-services-auth:17.0.0"
    implementation "com.google.android.gms:play-services-drive:17.0.0"

    implementation 'com.google.http-client:google-http-client-gson:1.26.0'
    implementation('com.google.api-client:google-api-client-android:1.26.0') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev136-1.25.0') {
        exclude group: 'org.apache.httpcomponents'
    }

    // 25.5.0+ needs minSdk 24; 25.4.0 is the newest that still runs on Android 6 (minSdk 23).
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    // firebase-ads used to pull analytics in. Keep it, at the measurement version
    // play-services-ads 25.4.0 brings (20.1.2), so usage stats keep flowing.
    implementation 'com.google.firebase:firebase-analytics:20.1.2'
    // Keep work-runtime at 2.7.1+: older releases (firebase-ads 17 pulled in 2.1.0) build
    // PendingIntents without FLAG_IMMUTABLE and crash on launch on Android 12+.
    implementation 'androidx.work:work-runtime:2.7.1'

    // Firestore before 24.x bundles grpc-okhttp 1.28, whose Android ALPN path calls the
    // reflective getAlpnSelectedProtocol. Conscrypt dropped that method in Android 10, so
    // the first Firestore connection dies with an AssertionError on the grpc thread.
    // grpc 1.32+ uses the standard getApplicationProtocol(); 24.0.0 ships grpc 1.42.
    implementation 'com.google.firebase:firebase-firestore:24.0.0'
    implementation 'com.google.firebase:firebase-auth:21.0.1'
    implementation 'com.firebaseui:firebase-ui-auth:7.2.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    implementation 'com.github.jetradarmobile:android-snowfall:1.2.1'

    implementation 'com.google.android.play:review:2.0.1'
}
