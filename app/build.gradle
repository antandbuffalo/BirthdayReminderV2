apply plugin: 'com.android.application'

apply plugin: 'com.google.gms.google-services'

android {
    compileSdk 34
    defaultConfig {
        applicationId "com.antandbuffalo.birthdayreminder"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 94
        versionName "3.16.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    namespace 'com.antandbuffalo.birthdayreminder'
    
    // Load keystore properties if file exists
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    
    // Signing configurations
    signingConfigs {
        release {
            storeFile file('../BirthdayReminderKeyStore.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['KEYSTORE_PASSWORD'] ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: keystoreProperties['KEY_ALIAS'] ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProperties['KEY_PASSWORD'] ?: ""
        }
    }
    
    buildFeatures {
        buildConfig true
    }
    
    lint {
        abortOnError false
    }
    
    buildTypes {
        release {
            minifyEnabled true          // Enable R8 code shrinking
            shrinkResources true        // Enable resource shrinking
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        // Keep debug without minification for faster builds
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude("META-INF/*.kotlin_module")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference:1.1.0-rc01'
    implementation 'androidx.navigation:navigation-fragment:2.0.0'
    implementation 'androidx.navigation:navigation-ui:2.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    // Google API Client (unified versions)
    implementation('com.google.api-client:google-api-client-android:1.26.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev136-1.25.0') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation 'com.google.http-client:google-http-client-gson:1.26.0'
    
    // Play Services (only what we need)
    implementation "com.google.android.gms:play-services-auth:18.1.0"

    implementation 'com.google.firebase:firebase-ads:17.0.0'

    implementation 'com.google.firebase:firebase-firestore:24.10.0'
    implementation 'com.google.firebase:firebase-auth:22.3.0'
    implementation 'com.firebaseui:firebase-ui-auth:8.0.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    implementation 'com.github.jetradarmobile:android-snowfall:1.2.1'

    implementation 'com.google.android.play:review:2.0.1'
}
